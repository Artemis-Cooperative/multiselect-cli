[package]
name = "multiselect-cli"
version = "2.1.0"
edition = "2021"
repository = "https://github.com/Artemis-Cooperative/multiselect-cli"

[[bin]]
name = "multiselect"
path = "src/bin/multiselect.rs"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[dev-dependencies]
expectrl = "0.7"
tempfile = "3"
